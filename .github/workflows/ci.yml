name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: CI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86-64
          - os: windows-latest
            name: Windows x86-64
          - os: ubuntu-24.04-arm
            name: Linux ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Format check
        run: cargo ci-fmt

      - name: Clippy
        run: cargo ci-clippy

      - name: Tests
        run: cargo ci-test

  # Cross-check against upstream Python pod5: Rust reads must match Python field by
  # field, and files written by Rust must be readable by Python.
  python-interop:
    name: Python pod5 ${{ matrix.pod5 }} interop
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest validated release (POD5_COMPAT_VERSION): reads every fixture.
          - pod5: "0.3.49"
            fixtures: "3 4 5 6 7"
          # Pre-V5 reader: checks that our V7 output stays readable by older pod5.
          # It cannot read V6 (32-bit channel), which is why upstream introduced V7.
          - pod5: "0.3.39"
            fixtures: "3 4 5 7"

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-interop-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-interop-cargo-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pod5 ${{ matrix.pod5 }}
        run: pip install "pod5==${{ matrix.pod5 }}"

      - name: Read parity (Rust reader vs Python reader)
        run: |
          for v in ${{ matrix.fixtures }}; do
            echo "::group::v$v"
            python tests/test_parity.py "tests/fixtures/multi_fast5_zip_v$v.pod5"
            echo "::endgroup::"
          done

      - name: Write parity (Rust writer, read back by Python)
        run: |
          for v in ${{ matrix.fixtures }}; do
            echo "::group::v$v"
            python tests/test_write_parity.py "tests/fixtures/multi_fast5_zip_v$v.pod5"
            echo "::endgroup::"
          done

      - name: From-scratch write (ReadRecord::new, read back by Python)
        run: python tests/test_scratch_parity.py
