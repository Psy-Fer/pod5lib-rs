name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: CI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86-64
          - os: windows-latest
            name: Windows x86-64
          - os: ubuntu-24.04-arm
            name: Linux ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Format check
        run: cargo ci-fmt

      - name: Clippy
        run: cargo ci-clippy

      - name: Tests
        run: cargo ci-test

  # Build and test on the minimum supported Rust version (rust-version in Cargo.toml).
  msrv:
    name: MSRV (Rust 1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-msrv-cargo-

      - name: Tests
        run: cargo test

  # Every single-byte corruption and truncation of a small POD5 file must give an
  # error, not a panic or an oversized allocation (tests/malformed.rs). Too slow for
  # the default debug test run, so it runs here in release mode.
  malformed-input:
    name: Malformed input (exhaustive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-release-cargo-

      - name: Exhaustive malformed-input test
        run: cargo test --release --test malformed -- --include-ignored

  # Cross-check against upstream Python pod5: Rust reads must match Python field by
  # field, and files written by Rust must be readable by Python.
  python-interop:
    name: Python pod5 ${{ matrix.pod5 }} interop
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest validated release (POD5_COMPAT_VERSION): reads every fixture.
          - pod5: "0.3.49"
            fixtures: >-
              multi_fast5_zip_v3 multi_fast5_zip_v4 multi_fast5_zip_v5
              multi_fast5_zip_v6 multi_fast5_zip_v7 all_fields_v7
          # Pre-V5 reader: checks that our V7 output stays readable by older pod5.
          # It cannot read V6 (32-bit channel), which is why upstream introduced V7,
          # and it predates the fields all_fields_v7 exercises (channel_32bit, V5).
          - pod5: "0.3.39"
            fixtures: >-
              multi_fast5_zip_v3 multi_fast5_zip_v4 multi_fast5_zip_v5
              multi_fast5_zip_v7

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-interop-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-interop-cargo-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pod5 ${{ matrix.pod5 }}
        run: pip install "pod5==${{ matrix.pod5 }}"

      - name: Read parity (Rust reader vs Python reader)
        run: |
          for f in ${{ matrix.fixtures }}; do
            echo "::group::$f"
            python tests/test_parity.py "tests/fixtures/$f.pod5"
            echo "::endgroup::"
          done

      - name: Write parity (Rust writer, read back by Python)
        run: |
          for f in ${{ matrix.fixtures }}; do
            echo "::group::$f"
            python tests/test_write_parity.py "tests/fixtures/$f.pod5"
            echo "::endgroup::"
          done

      - name: From-scratch write (ReadRecord::new, read back by Python)
        run: python tests/test_scratch_parity.py
