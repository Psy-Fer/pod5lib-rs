[package]
name = "pod5lib"
version = "0.2.0"
edition = "2024"
description = "Rust library for reading and writing POD5 nanopore sequencing files, compatible with ONT's pod5"
license = "MPL-2.0"
repository = "https://github.com/Psy-Fer/pod5lib-rs"
homepage = "https://github.com/Psy-Fer/pod5lib-rs"
documentation = "https://docs.rs/pod5lib"
readme = "README.md"
keywords = ["nanopore", "pod5", "bioinformatics", "genomics", "sequencing"]
categories = [
    "science::bioinformatics::genomics",
    "science::bioinformatics::sequence-analysis",
    "parser-implementations",
    "encoding",
]
authors = ["Psy-Fer"]
rust-version = "1.87"
# Keep test data, tooling and the mdBook sources out of the published crate.
exclude = [
    ".github/",
    "bench.sh",
    "docs/",
    "examples/*.pod5",
    "tests/*.py",
    "tests/data/",
    "tests/fixtures/",
    "tests/fixtures.rs",
]

[lib]
name = "pod5lib"
path = "src/lib.rs"

[dependencies]
# Apache Arrow IPC reading (Reads/Signal/RunInfo tables are Arrow IPC / Feather v2)
arrow = { version = "53", default-features = false, features = ["ipc"] }
# SVB16 / delta / zigzag with SIMD acceleration (replaces internal scalar VBZ codec)
svb = { version = "0.3.1", features = ["simd-auto"] }
# Signal decompression: VBZ = delta+zigzag+SVB16+zstd
zstd = { version = "0.13", default-features = false }
# Parallel VBZ compression
rayon = "1"
# Error derivation
thiserror = "2"
# Random (v4) file_identifier generation, as upstream pod5 does for each new file
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Used only by examples/dump_pod5.rs for the Python parity test.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
