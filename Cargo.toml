[package]
name = "pod5lib"
version = "0.1.0"
edition = "2024"
description = "Pure Rust library for reading and writing POD5 nanopore sequencing files"
license = "MPL-2.0"

[lib]
name = "pod5lib"
path = "src/lib.rs"

[dependencies]
# Apache Arrow IPC reading (Reads/Signal/RunInfo tables are Arrow IPC / Feather v2)
arrow = { version = "53", default-features = false, features = ["ipc"] }
# Signal decompression: VBZ = delta+zigzag+SVB16+zstd
zstd = { version = "0.13", default-features = false }
# Error derivation
thiserror = "2"

[dev-dependencies]
# Used only by examples/dump_pod5.rs for the Python parity test.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
